<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭小管家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 1000px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; color: #1a73e8; margin-bottom: 24px; font-size: 28px; }

.summary { display: flex; gap: 16px; margin-bottom: 24px; }
.summary-card { flex: 1; background: #fff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.summary-card .label { font-size: 13px; color: #888; }
.summary-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.summary-card.income .value { color: #22c55e; }
.summary-card.expense .value { color: #ef4444; }
.summary-card.balance .value { color: #1a73e8; }

.add-form { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.add-form h2 { font-size: 16px; margin-bottom: 16px; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-row input, .form-row select { padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; outline: none; }
.form-row input:focus, .form-row select:focus { border-color: #1a73e8; }
.form-row input[type="number"] { width: 120px; }
.form-row input[name="note"] { flex: 1; min-width: 150px; }
.form-row input[name="category"] { width: 120px; }
.form-row button { padding: 10px 24px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.form-row button:hover { background: #1558b0; }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.toolbar .filter-group { display: flex; gap: 8px; }
.toolbar .filter-btn { padding: 6px 16px; border: 1px solid #d9d9d9; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; }
.toolbar .filter-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
table { width: 100%; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-collapse: collapse; }
th { background: #fafafa; font-weight: 600; font-size: 13px; color: #666; padding: 12px 16px; text-align: left; }
td { padding: 12px 16px; font-size: 14px; border-top: 1px solid #f0f0f0; }
tr:hover td { background: #f8faff; }
.type-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.type-badge.income { background: #dcfce7; color: #16a34a; }
.type-badge.expense { background: #fee2e2; color: #dc2626; }
.amount-income { color: #16a34a; font-weight: 600; }
.amount-expense { color: #dc2626; font-weight: 600; }
.empty-msg { text-align: center; padding: 48px; color: #999; }
</style>
</head>
<body>
<div class="container">
  <h1>家庭小管家</h1>

  <div class="summary">
    <div class="summary-card income"><div class="label">总收入</div><div class="value" id="totalIncome">0.00</div></div>
    <div class="summary-card expense"><div class="label">总支出</div><div class="value" id="totalExpense">0.00</div></div>
    <div class="summary-card balance"><div class="label">结余</div><div class="value" id="balance">0.00</div></div>
  </div>

  <div class="add-form">
    <h2>新增记录</h2>
    <div class="form-row">
      <select id="addType"><option value="expense">支出</option><option value="income">收入</option></select>
      <input type="text" id="addUser" placeholder="用户" style="width:80px">
      <input type="number" id="addAmount" placeholder="金额" min="0" step="0.01" value="">
      <input type="text" id="addCategory" list="categoryList" placeholder="分类">
      <datalist id="categoryList">
        <option value="餐饮"><option value="交通"><option value="购物">
        <option value="住房"><option value="水电"><option value="通讯">
        <option value="医疗"><option value="教育"><option value="娱乐">
        <option value="其他">
      </datalist>
      <input type="text" id="addNote" placeholder="备注">
      <button onclick="addRecord()">添加</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="income" onclick="setFilter('income')">收入</button>
      <button class="filter-btn" data-filter="expense" onclick="setFilter('expense')">支出</button>
    </div>
  </div>

  <table>
    <thead><tr><th>日期</th><th>类型</th><th>金额</th><th>用户</th><th>分类</th><th>备注</th></tr></thead>
    <tbody id="recordsBody"></tbody>
  </table>
</div>

<script src="static/myjs.js"></script>
</body>
</html>
